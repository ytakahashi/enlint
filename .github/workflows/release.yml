name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"
          cache: true

      # JSR publishes the version declared in deno.json, so the pushed tag
      # (vX.Y.Z) must match it to keep GitHub releases and JSR versions aligned.
      - name: Verify tag matches deno.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match deno.json version v${version}"
            exit 1
          fi

      - name: Install dependencies
        run: deno install --frozen

      - name: Check formatting
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Test
        run: deno task test

      - name: Publish to JSR
        run: deno publish

  # Runs only after a successful JSR publish so that a GitHub release never
  # points to a version that is missing from JSR.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
